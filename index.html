<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
 
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
<div class="container">
 
    <div class="weather-card">
 
        <h2 class="text-center mb-4">
            <i class="fa-solid fa-cloud-sun"></i>
            Weather App
        </h2>
 
        <!-- Search -->
        <div class="input-group mb-4">
            <input
                type="text"
                class="form-control"
                id="cityInput"
                placeholder="Enter city name">
 
            <button class="btn btn-primary" id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
 
        <!-- Loading -->
        <div id="loadingBox" class="text-center d-none">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p class="mt-2 mb-0">Loading...</p>
        </div>
 
        <!-- Error -->
        <div id="errorBox" class="text-center d-none">
            <p class="text-danger mb-0" id="errorMsg"></p>
        </div>
 
        <!-- Weather -->
 
        <div id="weatherInfo">
 
            <div class="text-center">
 
                <i class="fa-solid fa-sun weather-icon" id="weatherIcon"></i>
 
                <h3 id="cityName">Dhaka</h3>
 
                <h1 id="temperature">31°C</h1>
 
                <p id="condition">Sunny</p>
 
            </div>
 
            <div class="row mt-4">
 
                <div class="col-6">
 
                    <div class="info-box">
 
                        <i class="fa-solid fa-water"></i>
 
                        <h6>Humidity</h6>
 
                        <p id="humidity">75%</p>
 
                    </div>
 
                </div>
 
                <div class="col-6">
 
                    <div class="info-box">
 
                        <i class="fa-solid fa-wind"></i>
 
                        <h6>Wind</h6>
 
                        <p id="wind">12 km/h</p>
 
                    </div>
 
                </div>
 
            </div>
 
        </div>
 
    </div>
 
</div>
 
<script src="script.js"></script>
 
</body>
</html>
